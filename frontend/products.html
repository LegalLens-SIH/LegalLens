<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - LegalLens</title>
<link rel="stylesheet" href="assets/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">
<style>
.ll-page{animation:ll-page-in .35s ease both}.ll-product-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.ll-product-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,39,74,.1);border-color:#76d6d5}.ll-search:focus-within{box-shadow:0 0 0 4px rgba(0,106,106,.12);border-color:#006a6a}.ll-score-track{height:8px;background:#e7e8e9;border-radius:999px;overflow:hidden}.ll-score-fill{height:100%;border-radius:inherit;background:#006a6a;transition:width .5s ease}.ll-modal-backdrop{position:fixed;inset:0;background:rgba(0,28,56,.45);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}.ll-modal{max-height:90vh;overflow:auto;animation:ll-page-in .25s ease both}@keyframes ll-page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="bg-background text-on-background min-h-screen">
<main class="ll-page max-w-[1440px] mx-auto p-5 sm:p-8">
<div class="flex flex-col gap-5 mb-8 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-xs uppercase tracking-[.18em] text-secondary font-bold">Repository</p><h1 class="text-3xl font-bold text-primary mt-2">Products</h1><p class="text-on-surface-variant mt-2">Review products and their latest LegalLens compliance evidence.</p></div><a class="inline-flex items-center justify-center gap-2 bg-secondary text-white px-4 py-3 rounded-lg text-sm font-bold" href="new-compliance-scan.html"><span class="material-symbols-outlined">add</span>New Compliance Scan</a></div>
<section class="bg-white border border-outline-variant rounded-lg p-4 mb-6"><div class="grid grid-cols-1 gap-3 md:grid-cols-[1fr_auto_auto] md:items-center"><label class="ll-search flex items-center gap-3 border border-outline-variant rounded-lg px-3 py-2 transition-shadow"><span class="material-symbols-outlined text-outline">search</span><span class="sr-only">Search products</span><input id="product-search" class="w-full border-0 p-1 focus:ring-0" placeholder="Search product, brand, manufacturer, or ID" type="search"></label><label class="flex items-center gap-2 text-sm font-semibold text-on-surface-variant">Filter<select id="product-filter" class="rounded-lg border-outline-variant text-sm"><option value="all">All statuses</option><option value="compliant">Fully Compliant</option><option value="mostly">Mostly Compliant</option><option value="partial">Partially Compliant</option><option value="action">Action Required</option><option value="non_compliant">Non-Compliant</option><option value="manual">Manual Verification</option></select></label><label class="flex items-center gap-2 text-sm font-semibold text-on-surface-variant">Sort<select id="product-sort" class="rounded-lg border-outline-variant text-sm"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="high">Highest Compliance</option><option value="low">Lowest Compliance</option><option value="az">Name A-Z</option><option value="za">Name Z-A</option></select></label></div></section>
<div id="product-status" class="mb-4 text-sm text-on-surface-variant" aria-live="polite"></div><section id="product-list" class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3"></section>
</main><div id="product-modal" class="hidden"></div>
<script src="assets/demo-data.js"></script><script src="assets/app.js"></script><script src="assets/auth-client.js"></script><script src="assets/shell.js"></script>
<script>
(function(){
var session=LL.getSession(),role='official',demo=!!(session&&session.demoMode),allProducts=[],list=document.getElementById('product-list'),status=document.getElementById('product-status');
var demoProducts=[{id:'DEMO-PROD-101',name:'Demo Premium Chips',brand:'Demo Foods',manufacturer:'Demo Foods Pvt. Ltd.',category:'Food & Beverage',score:82,status:'partial',date:'2026-09-18',scans:3},{id:'DEMO-PROD-102',name:'Demo Fruit Juice',brand:'Demo Beverages',manufacturer:'Demo Beverages Pvt. Ltd.',category:'Beverages',score:100,status:'compliant',date:'2026-09-17',scans:2},{id:'DEMO-PROD-103',name:'Demo Herbal Product',brand:'Demo Wellness',manufacturer:'Demo Wellness Pvt. Ltd.',category:'Healthcare',score:63,status:'action',date:'2026-09-15',scans:4},{id:'DEMO-PROD-104',name:'Demo Cosmetic Cream',brand:'Demo Care',manufacturer:'Demo Care Pvt. Ltd.',category:'Cosmetics',score:35,status:'non_compliant',date:'2026-09-12',scans:2}];
var statusMeta={compliant:['Fully Compliant','text-secondary','check_circle'],mostly:['Mostly Compliant','text-secondary','verified'],partial:['Partially Compliant','text-yellow-700','warning'],action:['Action Required','text-orange-700','priority_high'],non_compliant:['Non-Compliant','text-error','cancel'],manual:['Manual Verification','text-yellow-700','manage_search']};
function scoreStatus(score){if(score==null)return'manual';if(score===100)return'compliant';if(score>=90)return'mostly';if(score>=75)return'partial';if(score>=50)return'action';return'non_compliant'}
function normalize(item){var score=item.score!=null?item.score:item.latestScore;return{id:item.id||item.productId||item.sku||'PRODUCT',name:item.name||item.productName||'Unnamed product',brand:item.brand||item.manufacturer||'LegalLens record',manufacturer:item.manufacturer||item.companyName||'Not recorded',category:item.category||'Other',score:score,date:item.date||item.lastScanned||item.createdAt||'',status:item.status||scoreStatus(score),scans:item.scans||item.scanCount||1,sku:item.sku||''}}
function esc(value){return LL.escapeHtml(value==null?'':value)}
function card(p){var meta=statusMeta[p.status]||statusMeta.manual,score=p.score==null?'N/A':p.score+'%';return'<article class="ll-product-card bg-white border border-outline-variant rounded-lg p-5"><div class="flex justify-between gap-3"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-3xl text-primary">inventory_2</span><div><h2 class="font-bold text-primary">'+esc(p.name)+'</h2><p class="text-xs text-on-surface-variant">'+esc(p.id)+'</p></div></div><span class="'+meta[1]+' text-xs font-bold flex items-center gap-1"><span class="material-symbols-outlined text-base">'+meta[2]+'</span>'+meta[0]+'</span></div><p class="text-sm text-on-surface-variant mt-5">'+esc(p.manufacturer)+' · '+esc(p.category)+'</p><div class="mt-5"><div class="flex justify-between text-xs mb-2"><span class="text-on-surface-variant">Compliance score</span><strong class="text-primary">'+score+'</strong></div><div class="ll-score-track"><div class="ll-score-fill" style="width:'+(p.score==null?0:p.score)+'%"></div></div></div><div class="flex justify-between items-center mt-5 pt-4 border-t border-outline-variant text-xs text-on-surface-variant"><span>Last scanned: '+(p.date?new Date(p.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'Not available')+' · '+p.scans+' scan'+(p.scans===1?'':'s')+'</span><button class="text-secondary font-bold" onclick="showProduct(\''+esc(p.id)+'\')">View details</button></div></article>'}
function render(){var q=document.getElementById('product-search').value.trim().toLowerCase(),f=document.getElementById('product-filter').value,s=document.getElementById('product-sort').value,rows=allProducts.filter(function(p){return(!q||[p.name,p.brand,p.manufacturer,p.id,p.sku].join(' ').toLowerCase().indexOf(q)>=0)&&(f==='all'||p.status===f)});rows.sort(function(a,b){if(s==='az')return a.name.localeCompare(b.name);if(s==='za')return b.name.localeCompare(a.name);if(s==='high'||s==='low')return((b.score==null?-1:b.score)-(a.score==null?-1:a.score))*(s==='high'?1:-1);var diff=new Date(b.date||0)-new Date(a.date||0);return s==='newest'?diff:-diff});status.textContent=rows.length+' product'+(rows.length===1?'':'s')+' found';list.innerHTML=rows.length?rows.map(card).join(''):'<div class="col-span-full bg-white border border-outline-variant rounded-lg p-12 text-center"><span class="material-symbols-outlined text-4xl text-outline">inventory_2</span><h2 class="text-xl font-bold text-primary mt-3">No Products Found</h2><p class="text-on-surface-variant mt-2">Products analyzed through LegalLens will appear here.</p><a class="inline-flex mt-5 bg-secondary text-white px-4 py-3 rounded-lg font-bold" href="new-compliance-scan.html">Start New Scan</a></div>'}
window.showProduct=function(id){var p=allProducts.find(function(x){return x.id===id}),m=document.getElementById('product-modal');if(!p)return;m.className='ll-modal-backdrop';m.innerHTML='<article class="ll-modal bg-white rounded-lg max-w-2xl w-full p-6"><div class="flex justify-between gap-4"><div><p class="text-xs uppercase tracking-widest text-secondary font-bold">Product details</p><h2 class="text-2xl font-bold text-primary mt-2">'+esc(p.name)+'</h2><p class="text-sm text-on-surface-variant mt-1">'+esc(p.manufacturer)+' · '+esc(p.category)+'</p></div><button aria-label="Close product details" onclick="closeProduct()"><span class="material-symbols-outlined">close</span></button></div><div class="grid grid-cols-2 gap-4 mt-6"><div class="bg-surface-container-low p-4 rounded-lg"><p class="text-xs text-on-surface-variant">Compliance score</p><strong class="text-2xl text-primary">'+(p.score==null?'N/A':p.score+'%')+'</strong></div><div class="bg-surface-container-low p-4 rounded-lg"><p class="text-xs text-on-surface-variant">Status</p><strong class="text-sm '+(statusMeta[p.status]||statusMeta.manual)[1]+'">'+(statusMeta[p.status]||statusMeta.manual)[0]+'</strong></div></div><h3 class="font-bold text-primary mt-7">Scan history</h3><div class="mt-3 border border-outline-variant rounded-lg p-3 flex justify-between text-sm"><span>'+ (p.date||'No scan date')+'</span><strong>'+(p.score==null?'Manual review':p.score+'%')+'</strong></div><p class="text-xs text-on-surface-variant mt-5">Detailed evidence and uploaded product views are available from the linked compliance report after a scan.</p></article>'};window.closeProduct=function(){var m=document.getElementById('product-modal');m.className='hidden';m.innerHTML=''};
function load(){if(demo){allProducts=demoProducts;render();return}status.textContent='Loading product repository...';var request=Promise.resolve({items:LL.getScans().map(function(s){return normalize({id:s.id,name:s.productName,manufacturer:s.manufacturer,category:s.category,score:s.score,status:scoreStatus(s.score),date:s.date})})});request.then(function(data){allProducts=(data.items||data.products||data||[]).map(normalize);render()}).catch(function(error){status.textContent=error.message||'Unable to load products.';list.innerHTML='<div class="col-span-full bg-white border border-error/30 rounded-lg p-8 text-error">Unable to load the product repository. Please retry from the dashboard.</div>'})}
['product-search','product-filter','product-sort'].forEach(function(id){document.getElementById(id).addEventListener('input',render)});load();
})();
</script>
</body></html>
